<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Reply · Outlook</title>
  <link rel="stylesheet" href="./demo.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="./pane.js" defer></script>
  <script src="./send.js" defer></script>
</head>
<body>
  <main>
    <h1>Local Reply</h1>
    <p id="host">Connecting to Outlook…</p>
    <p>Send this text to <code>https://abc.localhost:8443</code> on this computer.</p>
    <form>
      <label for="message">Test message</label>
      <input id="message" value="Hello from the Outlook add-in!" maxlength="240" required>
      <button disabled>Send to Mac</button>
    </form>
    <p id="status" role="status"></p>
    <pre id="result"></pre>
    <p id="install" hidden><a href="./manifest.xml" download>Download the Outlook manifest</a></p>
  </main>
</body>
</html>
